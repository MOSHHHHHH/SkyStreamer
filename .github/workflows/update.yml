name: עדכון תחזית

on:
  schedule:
    - cron: "7 * * * *"        # כל שעה, בדקה 7 (פחות עומס מדקה 0)
  workflow_dispatch:           # הרצה ידנית מלשונית Actions
  push:
    paths:
      - "scripts/**"
      - ".github/workflows/update.yml"

permissions:
  contents: write

concurrency:
  group: weather-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: משיכת התחזיות
        env:
          # אופציונלי: אם ims.gov.il חוסם את GitHub, הגדר Secret בשם IMS_PROXY
          HTTPS_PROXY: ${{ secrets.IMS_PROXY }}
        run: python scripts/fetch_ims.py

      - name: שמירה לריפו
        run: |
          git config user.name  "weather-bot"
          git config user.email "weather-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "אין שינוי"
          else
            git commit -m "עדכון תחזית $(TZ=Asia/Jerusalem date '+%d/%m %H:%M')"
            git pull --rebase --autostash
            git push
          fi
